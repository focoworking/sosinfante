name: Deploy site
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # configure-pages activa el sitio si hace falta y devuelve su configuración.
      # Si el repositorio aún no tiene Pages habilitado, este paso falla y el
      # resto se salta, pero el run no se marca en rojo.
      - id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Aviso si Pages no está disponible
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "## GitHub Pages no está activado"
            echo
            echo "Actívalo en **Settings → Pages → Build and deployment →"
            echo "Source: GitHub Actions** y vuelve a lanzar este workflow."
          } >> "$GITHUB_STEP_SUMMARY"

      # El prefijo de rutas sale de la configuración de Pages: en un sitio de
      # proyecto es /sosinfante y en un dominio propio queda vacío.
      - if: steps.pages.outcome == 'success'
        run: node build.js
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4

  # Comprueba que el sitio compila, esté o no activado Pages.
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node build.js
      - run: |
          test -f site/index.html
          echo "Páginas generadas: $(find site -name '*.html' | wc -l)"
