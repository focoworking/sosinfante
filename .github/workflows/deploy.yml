name: Deploy site
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Activa GitHub Pages en modo "GitHub Actions" si todavía no lo está,
      # en lugar de fallar con "Get Pages site failed".
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # El prefijo sale de la propia configuración de Pages: en un sitio de
      # proyecto es /sosinfante y en un dominio propio queda vacío.
      - run: node build.js
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
