name: Rama publicable
# Mantiene la rama `publish` con el sitio ya compilado en su raíz, más el
# archivo .cpanel.yml que cPanel necesita para desplegarlo.
# Sirve para cualquier hosting con Git: GoDaddy cPanel (Git Version Control),
# Hostinger (hPanel → Avanzado → GIT) y similares. Sin contraseñas y sin
# subir archivos a mano.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Compilar el sitio
        run: node build.js

      # cPanel lee este archivo al pulsar «Desplegar HEAD»: copia el contenido
      # de la rama a la carpeta pública del dominio.
      - name: Preparar el despliegue de cPanel
        run: |
          {
            printf -- '---\n'
            printf 'deployment:\n'
            printf '  tasks:\n'
            printf '    - export DEPLOYPATH=$HOME/public_html/\n'
            printf '    - /bin/mkdir -p $DEPLOYPATH\n'
            printf '    - /bin/cp -R ./ $DEPLOYPATH\n'
            printf '    - /bin/rm -f $DEPLOYPATH/.cpanel.yml\n'
          } > site/.cpanel.yml
          cat site/.cpanel.yml

      - name: Actualizar la rama publish
        run: |
          set -e
          cd site
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Sitio compilado desde ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/publish

      - name: Resumen
        run: |
          {
            echo "## Rama \`publish\` actualizada"
            echo
            echo "- Páginas: $(find site -name '*.html' | wc -l)"
            echo "- Origen: commit \`${GITHUB_SHA::7}\`"
            echo
            echo "Conecta el hosting a la rama \`publish\` y pulsa Desplegar."
            echo "En cPanel de GoDaddy: Git Version Control → Create → URL del"
            echo "repositorio y rama \`publish\` → Manage → Deploy HEAD Commit."
          } >> "$GITHUB_STEP_SUMMARY"
