name: Rama publicable
# Mantiene la rama `publish` con el sitio ya compilado en su raíz, más el
# archivo .cpanel.yml que cPanel necesita para desplegarlo.
# Sirve para cualquier hosting con Git: GoDaddy cPanel (Git Version Control),
# Hostinger (hPanel → Avanzado → GIT) y similares. Sin contraseñas y sin
# subir archivos a mano.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Compilar el sitio
        run: node build.js

      # cPanel lee este archivo al pulsar «Desplegar HEAD»: copia el sitio a la
      # carpeta del dominio sosinfante.org (dominio adicional dentro de
      # public_html). Nunca toca public_html/ raíz ni copia la carpeta .git.
      - name: Preparar el despliegue de cPanel
        run: |
          {
            printf -- '---\n'
            printf 'deployment:\n'
            printf '  tasks:\n'
            printf '    - export DEPLOYPATH=$HOME/public_html/sosinfante.org/\n'
            printf '    - /bin/mkdir -p $DEPLOYPATH\n'
            for f in $(cd site && ls -A); do
              [ "$f" = ".cpanel.yml" ] && continue
              printf '    - /bin/cp -R %s $DEPLOYPATH\n' "$f"
            done
          } > site/.cpanel.yml
          cat site/.cpanel.yml

      # Conserva el historial de la rama publish para que cPanel pueda hacer
      # «Update from Remote» sin conflictos de historias no relacionadas.
      - name: Actualizar la rama publish
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin publish; then
            git worktree add -q ../pub FETCH_HEAD
          else
            git worktree add -q --detach ../pub
            (cd ../pub && git checkout -q --orphan publish-tmp && git rm -rqf .)
          fi
          rsync -a --delete --exclude .git site/ ../pub/
          cd ../pub
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios en el sitio compilado"
          else
            git commit -q -m "Sitio compilado desde ${GITHUB_SHA::7}"
            git push -q origin HEAD:refs/heads/publish
          fi

      - name: Resumen
        run: |
          {
            echo "## Rama \`publish\` actualizada"
            echo
            echo "- Páginas: $(find site -name '*.html' | wc -l)"
            echo "- Origen: commit \`${GITHUB_SHA::7}\`"
            echo
            echo "Conecta el hosting a la rama \`publish\` y pulsa Desplegar."
            echo "En cPanel de GoDaddy: Git Version Control → Create → URL del"
            echo "repositorio y rama \`publish\` → Manage → Deploy HEAD Commit."
          } >> "$GITHUB_STEP_SUMMARY"
